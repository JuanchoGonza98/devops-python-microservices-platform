apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-platform-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JuanchoGonza98/devops-python-microservices-platform.git
    targetRevision: develop
    path: deploy/kubernetes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-platform
  syncPolicy: {}