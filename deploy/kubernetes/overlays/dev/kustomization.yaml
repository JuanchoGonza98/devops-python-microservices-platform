apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-platform

resources:
  - ../../base

images:
  - name: devops-gateway
    newName: ghcr.io/juanchoGonza98/devops-gateway
    newTag: dev
  - name: devops-orders-service
    newName: ghcr.io/juanchoGonza98/devops-orders-service
    newTag: dev
  - name: devops-payments-service
    newName: ghcr.io/juanchoGonza98/devops-payments-service
    newTag: dev
  - name: devops-products-service
    newName: ghcr.io/juanchoGonza98/devops-products-service
    newTag: dev
  - name: devops-users-service
    newName: ghcr.io/juanchoGonza98/devops-users-service
    newTag: dev

patches:
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: products-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: users-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: payments-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: orders-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always