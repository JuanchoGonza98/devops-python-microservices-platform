apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-platform

resources:
  - ../../base
  - gateway-ingress.yaml
images:
  - name: ghcr.io/juanchogonza98/devops-gateway
    newName: ghcr.io/juanchogonza98/devops-gateway
    newTag: ci-beef3ec76b9940ceafd5a9e0ab277e04842a6bab
  - name: devops-orders-service
    newName: ghcr.io/juanchogonza98/devops-orders-service
    newTag: ci-beef3ec76b9940ceafd5a9e0ab277e04842a6bab
  - name: devops-payments-service
    newName: ghcr.io/juanchogonza98/devops-payments-service
    newTag: ci-beef3ec76b9940ceafd5a9e0ab277e04842a6bab
  - name: devops-products-service
    newName: ghcr.io/juanchogonza98/devops-products-service
    newTag: ci-beef3ec76b9940ceafd5a9e0ab277e04842a6bab
  - name: devops-users-service
    newName: ghcr.io/juanchogonza98/devops-users-service
    newTag: ci-beef3ec76b9940ceafd5a9e0ab277e04842a6bab

patches:
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: products-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: users-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: payments-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: orders-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always