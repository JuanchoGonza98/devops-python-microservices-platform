apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-platform

resources:
  - ../../base

images:
  - name: ghcr.io/juanchogonza98/devops-gateway
    newName: ghcr.io/juanchogonza98/devops-gateway
    newTag: ci-717db057550630b2934af10bb653b4ca12af413d
  - name: devops-orders-service
    newName: ghcr.io/juanchogonza98/devops-orders-service
    newTag: ci-717db057550630b2934af10bb653b4ca12af413d
  - name: devops-payments-service
    newName: ghcr.io/juanchogonza98/devops-payments-service
    newTag: ci-717db057550630b2934af10bb653b4ca12af413d
  - name: devops-products-service
    newName: ghcr.io/juanchogonza98/devops-products-service
    newTag: ci-717db057550630b2934af10bb653b4ca12af413d
  - name: devops-users-service
    newName: ghcr.io/juanchogonza98/devops-users-service
    newTag: ci-717db057550630b2934af10bb653b4ca12af413d

patches:
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: products-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: users-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: payments-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: orders-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always