apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-platform

resources:
  - ../../base

images:
  - name: ghcr.io/juanchogonza98/devops-gateway
    newName: devops-gateway
    newTag: local
  - name: devops-orders-service
    newName: devops-orders-service
    newTag: local
  - name: devops-payments-service
    newName: devops-payments-service
    newTag: local
  - name: devops-products-service
    newName: devops-products-service
    newTag: local
  - name: devops-users-service
    newName: devops-users-service
    newTag: local

patches:
  - target:
      kind: Service
      name: gateway
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080

  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  - target:
      kind: Deployment
      name: products-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  - target:
      kind: Deployment
      name: users-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  - target:
      kind: Deployment
      name: payments-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  - target:
      kind: Deployment
      name: orders-service
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent